[build]
  publish = "."

# Share links: sariful.netlify.app/pdf/<slug> opens the PDF reading page
[[redirects]]
  from = "/pdf"
  to = "/pdf.html"
  status = 200

[[redirects]]
  from = "/pdf/*"
  to = "/pdf.html"
  status = 200

# Per-PDF link preview (title + description) for Facebook / WhatsApp shares
[[edge_functions]]
  path = "/pdf/*"
  function = "pdf-meta"

# Blog posts: sariful.netlify.app/blog/<slug> opens the blog reading page
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog.html"
  status = 200

[[edge_functions]]
  path = "/blog/*"
  function = "blog-meta"
