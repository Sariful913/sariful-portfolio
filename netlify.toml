[build]
  publish = "."

# Share links: sariful.netlify.app/pdf/<slug> opens the PDF reading page
[[redirects]]
  from = "/pdf"
  to = "/pdf.html"
  status = 200

[[redirects]]
  from = "/pdf/*"
  to = "/pdf.html"
  status = 200

# Per-PDF link preview (title + description) for Facebook / WhatsApp shares
[[edge_functions]]
  path = "/pdf/*"
  function = "pdf-meta"
