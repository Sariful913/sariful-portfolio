backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Create {{collection}} {{slug}}"
    update: "Update {{collection}} {{slug}}"
    delete: "Delete {{collection}} {{slug}}"
    uploadMedia: "[skip ci] Upload {{path}}"
    deleteMedia: "[skip ci] Delete {{path}}"

# Files uploaded from the panel (blog cover images, PDFs)
media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://sariful.netlify.app
display_url: https://sariful.netlify.app
locale: "en"

collections:
  - name: "blog"
    label: "Blog Posts"
    files:
      - name: "posts"
        label: "Blog Posts"
        file: "content/blog-posts.json"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            fields:
              - {label: "Post ID (post1, post2... - notun post e porer number din)", name: "id", widget: "string", required: false}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category (jemon: Guide • AI Video)", name: "category", widget: "string"}
              - {label: "Short excerpt (card e dekhabe)", name: "excerpt", widget: "text"}
              - {label: "Cover image", name: "image", widget: "image"}
              - {label: "Full article (Bangla - paragraph er majhe ek line faka rakhun)", name: "body", widget: "text"}

  - name: "resources"
    label: "Resources (PDF)"
    files:
      - name: "items"
        label: "Resources"
        file: "content/resources.json"
        fields:
          - label: "Resources"
            name: "resources"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Link name / slug (English chhoto hater, jemon: facebook-automation) - link hobe sariful.netlify.app/pdf/ei-nam", name: "slug", widget: "string", required: false}
              - {label: "Description (Bangla)", name: "description", widget: "text"}
              - {label: "Type", name: "kind", widget: "select", options: ["free", "paid"]}
              - {label: "Price (sudhu Paid hole, jemon ৳99)", name: "price", widget: "string", required: false}
              - {label: "Tag (jemon: Beginner friendly / Free download)", name: "tag", widget: "string", required: false}
              - {label: "Link - Free hole Drive link, Paid hole khali rakhun", name: "link", widget: "string", required: false}
              - {label: "Or upload PDF here (Free hole)", name: "pdf_file", widget: "file", required: false}
              - {label: "Full post (PDF page e dekhabe - paragraph er majhe ek line faka; sub-heading er age ## din)", name: "body", widget: "text", required: false}
