<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free PDF - MD Sariful Islam</title>
<meta name="description" content="MD Sariful Islam-এর ফ্রি গাইড - পুরো পোস্ট পড়ুন, PDF দেখুন আর ডাউনলোড করুন।">
<meta property="og:type" content="article">
<meta property="og:title" content="Free PDF Guide - MD Sariful Islam">
<meta property="og:description" content="পুরো পোস্ট পড়ুন, PDF দেখুন আর এক ক্লিকে ডাউনলোড করুন।">
<meta property="og:image" content="https://sariful.netlify.app/images/blog-1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050B16;--panel:#0A1830;--cyan:#22D3EE;--blue:#00BFFF;--violet:#818CF8;--text:#EFF7FF;--muted:#9DB4C8;--line:rgba(34,211,238,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:"Hind Siliguri","Inter",system-ui,sans-serif;line-height:1.75;min-height:100vh;
  background:radial-gradient(900px 500px at 15% -10%,rgba(0,191,255,.14),transparent 60%),radial-gradient(700px 400px at 100% 0%,rgba(129,140,248,.12),transparent 60%),var(--bg)}
a{color:var(--cyan)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:900px;margin:0 auto;padding:18px 20px}
.brand{font-family:Inter,sans-serif;font-weight:800;letter-spacing:.5px;color:var(--text);text-decoration:none}
.brand span{color:var(--blue)}
.back{color:var(--muted);text-decoration:none;font-size:15px}
.back:hover{color:var(--cyan)}
main{max-width:900px;margin:0 auto;padding:10px 20px 60px}
.card{background:linear-gradient(180deg,rgba(10,24,48,.92),rgba(10,24,48,.7));border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.tag{display:inline-block;font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:14px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.3;margin-bottom:12px}
.lead{color:var(--muted);font-size:18px;margin-bottom:22px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 26px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter,"Hind Siliguri",sans-serif;font-weight:700;font-size:16px;text-decoration:none;border-radius:12px;padding:13px 22px;border:1px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#031020;box-shadow:0 8px 24px rgba(0,191,255,.35)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn-wa{background:#25D366;color:#04140a}
.article{font-size:17.5px}
.article p{margin-bottom:16px}
.article h2{font-size:22px;margin:26px 0 10px;color:var(--cyan)}
.viewer{margin-top:28px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0b1424}
.viewer-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-family:Inter,sans-serif;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
.viewer iframe{display:block;width:100%;height:75vh;min-height:480px;border:0;background:#fff}
.cta{margin-top:30px;padding:22px;border-radius:16px;border:1px dashed var(--line);text-align:center;color:var(--muted)}
.cta strong{color:var(--text)}
.share{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 26px;color:var(--muted);font-size:15px}
.sh{font-family:Inter,"Hind Siliguri",sans-serif;font-size:14px;font-weight:600;text-decoration:none;color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.sh:hover{border-color:var(--cyan);color:var(--cyan)}
.sh.fb{border-color:rgba(24,119,242,.6)}.sh.wa{border-color:rgba(37,211,102,.6)}.sh.ms{border-color:rgba(0,132,255,.6)}
.state{text-align:center;padding:60px 20px;color:var(--muted)}
.list a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text);font-weight:600}
.list a:hover{color:var(--cyan)}
footer{text-align:center;color:var(--muted);font-size:14px;padding:20px}
@media (max-width:560px){.card{padding:22px 16px}.btn{width:100%;justify-content:center}.viewer iframe{height:70vh}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">SARIFUL<span>.</span></a>
  <a class="back" href="/#resources">&larr; সব রিসোর্স</a>
</header>
<main>
  <div class="card" id="app"><div class="state">লোড হচ্ছে...</div></div>
</main>
<footer>&copy; MD Sariful Islam - AI Advertising Center</footer>

<script>
(function(){
"use strict";
var WA = "8801609494024";

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

function slugify(s){
  return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
/* Same rule as content-loader.js: own slug, else English title, else pdf-N */
function fileSlug(it){ var f = String(it.pdf_file || "").split("?")[0].split("/").pop().replace(/\.pdf$/i, ""); return slugify(f); }
function slugOf(it, i){ return slugify(it.slug) || fileSlug(it) || slugify(it.title) || ("pdf-" + (i + 1)); }

/* Body text: blank line = new paragraph, a line starting with "## " = sub-heading */
function render(body){
  return String(body || "").split(/\n\s*\n/).filter(function(p){ return p.trim(); }).map(function(p){
    p = p.trim();
    if(p.indexOf("## ") === 0) return "<h2>" + esc(p.slice(3)) + "</h2>";
    return "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>";
  }).join("");
}

function driveId(url){
  var m = String(url || "").match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{10,})/);
  return m ? m[1] : null;
}

function pdfUrls(it){
  var src = it.pdf_file || it.link || "";
  if(!src) return null;
  var id = driveId(src);
  if(id) return { view: "https://drive.google.com/file/d/" + id + "/preview",
                  download: "https://drive.google.com/uc?export=download&id=" + id, direct: false };
  var abs = new URL(src, location.origin).href;
  var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  return { view: mobile ? ("https://docs.google.com/viewer?embedded=true&url=" + encodeURIComponent(abs)) : abs,
           download: src, open: abs, direct: true };
}

function current(){
  var m = location.pathname.match(/\/pdf\/([^\/?#]+)/);
  if(m) return decodeURIComponent(m[1]).toLowerCase();
  var q = new URLSearchParams(location.search).get("r");
  return q ? q.toLowerCase() : "";
}

var app = document.getElementById("app");

function showList(items, note){
  var html = (note ? "<p class='lead'>" + esc(note) + "</p>" : "") + "<h1>রিসোর্স</h1><div class='list'>";
  items.forEach(function(it, i){
    var label = it.kind === "paid" ? (it.price || "Premium") : "FREE";
    html += "<a href='/pdf/" + esc(slugOf(it, i)) + "'>" + esc(it.title) + " <span style='color:var(--muted);font-weight:500'>(" + esc(label) + ")</span> &rarr;</a>";
  });
  app.innerHTML = html + "</div>";
}

function shareBar(it){
  var url = location.origin + location.pathname;
  var text = (it.title || "") + (it.description ? " - " + it.description : "");
  var u = encodeURIComponent(url), t = encodeURIComponent(text + "\n" + url);
  var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  var h = "<div class='share'><span>শেয়ার করুন:</span>";
  h += "<a class='sh fb' href='https://www.facebook.com/sharer/sharer.php?u=" + u + "' target='_blank' rel='noopener'>Facebook</a>";
  h += "<a class='sh wa' href='https://wa.me/?text=" + t + "' target='_blank' rel='noopener'>WhatsApp</a>";
  h += "<a class='sh ms' href='" + (mobile ? ("fb-messenger://share/?link=" + u) : ("https://www.facebook.com/sharer/sharer.php?u=" + u)) + "' target='_blank' rel='noopener'>Messenger</a>";
  h += "<button class='sh cp' type='button' data-copy='" + esc(url) + "'>লিংক কপি</button>";
  if(navigator.share) h += "<button class='sh nt' type='button' data-native='1'>আরও...</button>";
  return h + "</div>";
}

document.addEventListener("click", function(e){
  var c = e.target.closest && e.target.closest("[data-copy]");
  if(c){
    var v = c.getAttribute("data-copy");
    var done = function(){ c.textContent = "কপি হয়েছে ✓"; setTimeout(function(){ c.textContent = "লিংক কপি"; }, 2000); };
    if(navigator.clipboard) navigator.clipboard.writeText(v).then(done, function(){ prompt("লিংক কপি করুন:", v); });
    else { prompt("লিংক কপি করুন:", v); }
    return;
  }
  var n = e.target.closest && e.target.closest("[data-native]");
  if(n){ navigator.share({ title: document.title, url: location.origin + location.pathname }).catch(function(){}); }
});

function showItem(it){
  document.title = (it.title || "PDF") + " - MD Sariful Islam";
  var urls = it.kind === "paid" ? null : pdfUrls(it);
  var html = "";
  html += "<span class='tag'>" + esc(it.tag || (it.kind === "paid" ? "Premium" : "Free PDF")) + "</span>";
  html += "<h1>" + esc(it.title) + "</h1>";
  if(it.description) html += "<p class='lead'>" + esc(it.description) + "</p>";

  html += "<div class='actions'>";
  if(it.kind === "paid"){
    var t = "Hi Sariful, I want to buy the " + (it.title || "") + " (" + (it.price || "") + ").";
    html += "<a class='btn btn-wa' href='https://wa.me/" + WA + "?text=" + encodeURIComponent(t) + "' target='_blank' rel='noopener'>WhatsApp-এ কিনুন - " + esc(it.price || "") + "</a>";
  }else if(urls){
    html += "<a class='btn btn-primary' href='" + esc(urls.download) + "'" + (urls.direct ? " download" : "") + " target='_blank' rel='noopener'>&#8595; PDF ডাউনলোড করুন</a>";
    html += "<a class='btn btn-ghost' href='#read'>পুরো PDF পড়ুন</a>";
  }
  html += "</div>";
  if(it.kind === "paid") html += "<p class='lead' style='font-size:.95rem'>পেমেন্টের পর PDF টি সরাসরি WhatsApp-এ পাঠিয়ে দেওয়া হবে।</p>";
  html += shareBar(it);

  if(it.body) html += "<div class='article'>" + render(it.body) + "</div>";

  if(urls){
    html += "<div class='viewer' id='read'><div class='viewer-head'><span>" + esc(it.title) + "</span>" +
            (urls.open ? "<a href='" + esc(urls.open) + "' target='_blank' rel='noopener'>নতুন ট্যাবে খুলুন</a>" : "<a href='" + esc(urls.download) + "' target='_blank' rel='noopener'>ডাউনলোড</a>") + "</div>" +
            "<iframe src='" + esc(urls.view) + "' title='" + esc(it.title) + "' loading='lazy' allow='autoplay'></iframe></div>";
  }

  html += "<div class='cta'><strong>আপনার ব্যবসার জন্য AI ভিডিও বা AI এজেন্ট লাগবে?</strong><br>" +
          "<a class='btn btn-wa' style='margin-top:12px' href='https://wa.me/" + WA + "' target='_blank' rel='noopener'>WhatsApp-এ কথা বলুন</a></div>";
  app.innerHTML = html;
}

fetch("/content/resources.json", {cache: "no-store"}).then(function(r){
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}).then(function(data){
  var items = Array.isArray(data) ? data : (data.resources || []);
  var want = current();
  if(!want){ showList(items); return; }
  var found = null;
  items.forEach(function(it, i){ if(!found && slugOf(it, i) === want) found = it; });
  if(found) showItem(found);
  else showList(items, "এই লিংকের PDF পাওয়া যায়নি - নিচের তালিকা থেকে বেছে নিন।");
}).catch(function(){
  app.innerHTML = "<div class='state'>এখন লোড করা যাচ্ছে না। একটু পরে আবার চেষ্টা করুন, অথবা <a href='/#resources'>সাইটে যান</a>।</div>";
});
})();
</script>
</body>
</html>
